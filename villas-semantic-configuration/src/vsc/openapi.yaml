          default: "\n"
          $ref: '#/components/schemas/shared-format-line-delimiter'
        comment_prefix:
          default: '#'
          $ref: '#/components/schemas/shared-format-line-comment_prefix'
        header:
          default: true
          $ref: '#/components/schemas/shared-format-line-header'
        skip_first_line:
          default: false
          $ref: '#/components/schemas/shared-format-line-skip_first_line'
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: true
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: true
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    format-villas_web:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: villas.web
        source_index:
          default: 0
          $ref: '#/components/schemas/shared-format-villas-source_index'
        validate_source_index:
          default: false
          $ref: '#/components/schemas/shared-format-villas-validate_source_index'
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: true
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: true
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    format:
      $schema: http://json-schema.org/draft-07/schema
      description: |
        The payload format which is used to encode and decode exchanged messages.
      example: villas.human
      type:
        - object
        - string
      discriminator:
        x-villas-plugin: format
        propertyName: type
        mapping:
          csv: '#/components/schemas/format-csv'
          gtnet: '#/components/schemas/format-gtnet'
          iotagent_ul: '#/components/schemas/format-iotagent_ul'
          json: '#/components/schemas/format-json'
          json.edgeflex: '#/components/schemas/format-json_edgeflex'
          json.kafka: '#/components/schemas/format-json_kafka'
          json.reserve: '#/components/schemas/format-json_reserve'
          opal.asyncip: '#/components/schemas/format-opal_asyncip'
          protobuf: '#/components/schemas/format-protobuf'
          raw: '#/components/schemas/format-raw'
          tsv: '#/components/schemas/format-tsv'
          value: '#/components/schemas/format-value'
          villas.binary: '#/components/schemas/format-villas_binary'
          villas.human: '#/components/schemas/format-villas_human'
          villas.web: '#/components/schemas/format-villas_web'
    shared-node-enabled:
      type: boolean
      description: |
        Whether or not this direction of the node is used.
    shared-node-builtin:
      type: boolean
      default: true
      title: Builtin hook functions
      description: |
        By default, each node and paths has a couple of default hooks attached to them. With this setting the attachment of built-in hooks can be disabled.
    shared-node-vectorize:
      type: integer
      minimum: 1
      default: 1
      description: |
        This setting allows to send multiple samples in a single message to the destination nodes.

        The value of this setting determines how many samples will be combined into one packet.
    shared-hook-priority:
      type: integer
      minimum: 0
    shared-hook-signal:
      type: string
      description: The name of a signal to which this hook should be applied
      example: busA.V
    shared-hook-signals:
      type: array
      minItems: 1
      description: A list of signal names to which a hook should be applied.
      example:
        - busA.V
        - busB.V
        - busC.V
      items:
        type: string
        description: The name of a signal to which a hook should be applied.
    hook-average:
      type: object
      required:
        - type
        - offset
      additionalProperties: false
      properties:
        type:
          type: string
          const: average
        offset:
          type: integer
          description: |
            The signal offset at which the average signal should be inserted.

            **Examples:**
            - `0` inserts the averaged signal before all other signals in the sample
            - `1` inserts the averaged signal after the first signal.
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          $ref: '#/components/schemas/shared-hook-signal'
        signals:
          $ref: '#/components/schemas/shared-hook-signals'
      oneOf:
        - required:
            - signals
        - required:
            - signal
    hook-cast:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: cast
        new_type:
          type: string
          enum:
            - integer
            - float
            - boolean
            - complex
          description: The type of the casted signal.
          example: integer
        new_name:
          type: string
          description: The new name of the casted signal.
          example: BusA.V
        new_unit:
          type: string
          description: The new unit of the casted signal.
          example: V
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          $ref: '#/components/schemas/shared-hook-signal'
        signals:
          $ref: '#/components/schemas/shared-hook-signals'
      oneOf:
        - required:
            - signals
        - required:
            - signal
    hook-decimate:
      type: object
      required:
        - type
        - ratio
      additionalProperties: false
      properties:
        type:
          type: string
          const: decimate
        ratio:
          type: integer
          description: The decimation ratio. A value of 4 will skip every, but the 4th sample in a row.
          example: 4
        renumber:
          type: boolean
          default: false
          description: Renumber the sequence numbers of the output samples starting from zero.
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    hook-digest:
      type: object
      required:
        - type
        - uri
        - algorithm
      additionalProperties: false
      properties:
        type:
          type: string
          const: digest
        uri:
          description: The output file for digests.
          example: digest.txt
          type: string
        algorithm:
          description: The algorithm used for calculating digests.
          example: sha256
          type: string
        mode:
          description: The file open mode passed to fopen (e.g. "w" to truncate, "a" to append).
          example: w
          type: string
        priority:
          default: 999
          $ref: '#/components/schemas/shared-hook-priority'
    hook-dp:
      type: object
      required:
        - type
        - f0
        - harmonics
        - signal
      additionalProperties: false
      properties:
        type:
          type: string
          const: dp
        f0:
          description: The fundamental frequency.
          example: 50
          type: number
        dt:
          description: The timestep of the input samples. Exclusive with `rate` setting.
          examples:
            - 0.00005
          type: number
        rate:
          description: The rate of the input samples. Exclusive with `dt` setting.
          type: number
        harmonics:
          type: array
          minItems: 1
          description: A list of selected harmonics which should be calculated.
          example:
            - 0
            - 1
            - 3
            - 5
          items:
            type: integer
        inverse:
          description: Enable the calucation of the inverse transform.
          type: boolean
          default: false
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          description: The name or index of a signal to which this hook should be applied
          oneOf:
            - $ref: '#/components/schemas/shared-hook-signal'
            - type: integer
      oneOf:
        - required:
            - dt
        - required:
            - rate
    hook-drop:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: drop
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    hook-dump:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: dump
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    hook-ebm:
      $schema: http://json-schema.org/draft-07/schema
      type: object
      required:
        - type
        - phases
      additionalProperties: false
      properties:
        type:
          type: string
          const: ebm
        phases:
          description: Signal indices for voltage & current values for each phase.
          type: array
          items:
            type: array
            minItems: 2
            examples:
              - - 0
                - 1
              - - 2
                - 3
              - - 4
                - 5
            additionalItems: false
            items:
              type: integer
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    hook-fix:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: fix
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    shared-duration:
      oneOf:
        - type: string
          description: |
            Duration as a string, e.g., "1h30m", "45s", "200ms".
          pattern: ^(\d+(d|h|ms|us|ns|m|s))+$
          examples:
            - 6d23h30m50s40ms
            - 45s
            - 2d200ms
        - type: integer
          description: |
            Duration as integer.
          minimum: 0
          examples:
            - 5400000
            - 45000
            - 200
    hook-frame:
      type: object
      required:
        - type
        - interval
      properties:
        type:
          type: string
          const: frame
        trigger:
          description: The trigger for new frames.
          type: string
          default: timestamp
          enum:
            - sequence
            - timestamp
        interval:
          description: The interval in which frames are annotated.
          default: 1s
          not:
            const: null
        priority:
          default: 10
          $ref: '#/components/schemas/shared-hook-priority'
      additionalProperties: false
      oneOf:
        - required:
            - trigger
          properties:
            trigger:
              const: sequence
            interval:
              type: integer
          additionalProperties: {}
        - properties:
            trigger:
              const: timestamp
            interval:
              $ref: '#/components/schemas/shared-duration'
          additionalProperties: {}
    hook-gate:
      type: object
      required:
        - type
        - signal
      additionalProperties: false
      properties:
        type:
          type: string
          const: gate
        mode:
          description: The triggering condition at which the gate opens.
          type: string
          default: rising_edge
          enum:
            - above
            - below
            - rising_edge
            - falling_edge
        threshold:
          default: 0.5
          description: The threshold the signal needs to overcome before the gate opens.
          type: number
        duration:
          description: The number of seconds for which the gate opens when the triggering condition is met. Exclusive with the `samples` setting.
          type: number
        samples:
          description: The number if samples for which the gate opens when the triggering condition is met. Exclusive with the `duration` setting.
          type: integer
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          $ref: '#/components/schemas/shared-hook-signal'
    hook-jitter_calc:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: jitter_calc
        priority:
          default: 0
          $ref: '#/components/schemas/shared-hook-priority'
    hook-limit_rate:
      type: object
      required:
        - type
        - rate
      additionalProperties: false
      properties:
        type:
          type: string
          const: limit_rate
        rate:
          type: number
          exclusiveMinimum: 0
          description: The maximum sample rate in `1/s` before this hook will drop samples.
        mode:
          type: string
          default: local
          description: Timestamp which should be used for rate estimation.
          enum:
            - local
            - received
            - origin
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    hook-limit_value:
      type: object
      required:
        - type
        - min
        - max
      additionalProperties: false
      properties:
        type:
          type: string
          const: limit_value
        min:
          description: The smallest value which will pass through the hook before getting clipped.
          type: number
        max:
          description: The largest value which will pass through the hook before getting clipped.
          type: number
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          $ref: '#/components/schemas/shared-hook-signal'
        signals:
          $ref: '#/components/schemas/shared-hook-signals'
      oneOf:
        - required:
            - signals
        - required:
            - signal
    shared-signal-name:
      type: string
      title: Signal name
      description: |
        A name which describes the signal.
      example: Bus123_U
    shared-signal-unit:
      type: string
      title: Signal unit
      description: The unit of the signal.
      example: V
    shared-signal-type:
      type: string
      title: Signal data-type
      description: |
        The data-type of the signal.
      default: float
      enum:
        - integer
        - float
        - boolean
        - complex
    shared-signal-init:
      title: Initial signal value.
      description: |
        The initial value of the signal.
      oneOf:
        - type: number
        - type: boolean
        - type: object
          required:
            - real
            - imag
          additionalProperties: false
          properties:
            real:
              type: number
            imag:
              type: number
    shared-signal-enabled:
      type: boolean
      default: true
      description: |
        Signals can be disabled which causes them to be ignored.
    hook-lua:
      type: object
      required:
        - type
      additionalProperties:
        description: |
          The Lua hook will pass the complete hook configuration to the `prepare()` Lua function.
          So you can add arbitrary settings here which are then consumed by the Lua script.
      properties:
        type:
          type: string
          const: lua
        use_names:
          type: boolean
          default: true
          description: Enables or disables the use of signal names in the `process()` Lua function. If disabled, numeric indices will be used.
        script:
          type: string
          description: |
            Provide the path to a Lua script containing functions for the individual hook points.
            Define some or all of the following functions in your Lua script:

            #### `prepare(cfg)`

            Called during initialization with a Lua table which contains the full hook configuration.

            #### `start()`

            Called when the associated node or path is started

            #### `stop()`

            Called when the associated node or path is stopped

            #### `restart()`

            Called when the associated node or path is restarted.
            Falls back to `stop()` + `start()` if absent.

            #### `process(smp)`

            Called for each sample which is being processed.
            The sample is passed as a Lua table with the following fields:

            - `sequence`     The sequence number of the sample.
            - `flags`        The flags field of the sample.
            - `ts_origin`    The origin timestamp as a Lua table containing the following keys:
            | Index | Description |
            |:--    |:--          |
            | 0     | seconds     |
            | 1     | nanoseconds |

            - `ts_received`  The receive timestamp a Lua table containing the following keys:
            | Index | Description |
            |:--    |:--          |
            | 0     | seconds     |
            | 1     | nanoseconds |

            - `data`         The sample data as a Lua table container either numeric indices or the signal names depending on the 'use_names' option of the hook.

            #### `periodic()`

            Called periodically with the rate of @ref node-config-stats.
        signals:
          description: |
            A definition of signals which this hook will emit.
            Here a list of signal definitions like @ref node-config-node-signals is expected.
          type: array
          items:
            type: object
            required:
              - expression
            additionalProperties:
              description: |
                The Lua hook passes each signal definition to the Lua script.
                You may add arbitrary custom properties to a signal here which are
                then available as context to your Lua code (e.g. within `prepare()`
                or `process()`). You are responsible for consuming them in your script.
            properties:
              expression:
                type: string
                example: math.sqrt(smp.data[0] ^ 2 + smp.data[1] ^ 2)
                description: |
                  An arbitrary Lua expression which will be evaluated and used for the value of the signal.
                  Note you can access the current sample using the global Lua variable `smp`.
              name:
                $ref: '#/components/schemas/shared-signal-name'
              unit:
                $ref: '#/components/schemas/shared-signal-unit'
              type:
                $ref: '#/components/schemas/shared-signal-type'
              init:
                $ref: '#/components/schemas/shared-signal-init'
              enabled:
                $ref: '#/components/schemas/shared-signal-enabled'
        priority:
          default: 1
          $ref: '#/components/schemas/shared-hook-priority'
    hook-ma:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: ma
        window_size:
          type: integer
          description: The size of the window (number of samples) which should be used for the moving average filter.
          example: 100
          default: 0
          minimum: 0
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          $ref: '#/components/schemas/shared-hook-signal'
        signals:
          $ref: '#/components/schemas/shared-hook-signals'
      oneOf:
        - required:
            - signals
        - required:
            - signal
    hook-pmu_dft:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: pmu_dft
        sample_rate:
          type: integer
          default: 0
          minimum: 0
          example: 10000
          description: The sampling rate of the input signal.
        start_frequency:
          type: number
          minimum: 0
          example: 49.7
          description: The lowest frequency bin.
        end_frequency:
          type: number
          example: 50.3
          minimum: 0
          description: The highest frequency bin.
        frequency_resolution:
          type: number
          example: 0.1
          minimum: 0
          description: The frequency resolution of the DFT.
        dft_rate:
          type: integer
          example: 1
          minimum: 1
          description: The number of phasor calculations performed per second.
        window_size_factor:
          type: integer
          default: 1
          description: A factor that increases the automatically determined window size by a multiplicative factor.
        window_type:
          type: string
          enum:
            - flattop
            - hamming
            - hann
            - none
          default: none
          description: The window type.
        padding_type:
          type: string
          enum:
            - zero
            - signal_repeat
            - none
          default: none
          description: The padding type.
        estimate_type:
          type: string
          enum:
            - quadratic
            - none
          default: none
          description: The frequency estimation type.
        pps_index:
          type: integer
          description: The signal index of the PPS signal. This is only needed if data dumper is active.
          default: 0
        angle_unit:
          type: string
          enum:
            - rad
            - degree
          default: rad
          description: The unit of the phase angle.
        add_channel_name:
          type: boolean
          default: false
          description: Adds the name of the channel as a suffix to the signal name e.g `amplitude_ch1`.
        timestamp_align:
          enum:
            - left
            - center
            - right
          default: center
          description: The timestamp alignment in respect to the the window.
        phase_offset:
          type: number
          default: 0
          example: 10
          description: An offset added to a calculated phase.
        amplitude_offset:
          type: number
          default: 0
          example: 10
          description: An offset added to the calculated amplitude.
        frequency_offset:
          type: number
          default: 0
          example: 0.2
          description: An offset added to the calculated frequency.
        rocof_offset:
          type: number
          default: 0
          example: 1
          description: An offset added to the calculated RoCoF. This setting does not really make sense but is available for completeness reasons
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          $ref: '#/components/schemas/shared-hook-signal'
        signals:
          $ref: '#/components/schemas/shared-hook-signals'
      oneOf:
        - required:
            - signals
        - required:
            - signal
    hook-pps_ts:
      type: object
      required:
        - type
        - signal
      additionalProperties: false
      properties:
        type:
          type: string
          const: pps_ts
        threshold:
          type: number
          default: 1.5
          description: The signal level threshold of the PPS signal which is used to detect an edge.
        time_source:
          type: string
          enum:
            - sample
            - os
          default: os
          description: Defines from where the second value is derived.
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          $ref: '#/components/schemas/shared-hook-signal'
    hook-print:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: print
        output:
          type: string
          default: /dev/stdout
          description: An optional path to a file to which the samples processed by this hook will be written to.
        format:
          default: villas.human
          $ref: '#/components/schemas/format'
        prefix:
          type: string
          default: ''
          description: An optional prefix which will be prepended to each line written by this hook to the output
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    hook-reorder_ts:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: reorder_ts
        window_size:
          type: integer
          default: 16
          minimum: 1
          description: The number of samples buffered for reordering.
        priority:
          default: 2
          $ref: '#/components/schemas/shared-hook-priority'
    hook-restart:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: restart
        priority:
          default: 1
          $ref: '#/components/schemas/shared-hook-priority'
    hook-rms:
      type: object
      required:
        - type
        - window_size
      additionalProperties: false
      properties:
        type:
          type: string
          const: rms
        window_size:
          type: integer
          description: The size of the window (number of samples) which should be used for the moving average filter.
          example: 100
          minimum: 1
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          $ref: '#/components/schemas/shared-hook-signal'
        signals:
          $ref: '#/components/schemas/shared-hook-signals'
      oneOf:
        - required:
            - signals
        - required:
            - signal
    hook-round:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: round
        precision:
          type: integer
          default: 1
          example: 4
          description: The number of decimal digits to which the signal is rounded.
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          $ref: '#/components/schemas/shared-hook-signal'
        signals:
          $ref: '#/components/schemas/shared-hook-signals'
      oneOf:
        - required:
            - signals
        - required:
            - signal
    hook-scale:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: scale
        offset:
          type: number
          default: 0
          example: 100.5
          description: The offset which is added to the signal after gain.
        scale:
          type: number
          default: 1
          example: 1000
          description: The factor by which the signal is multiplied before the offset is added.
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
        signal:
          $ref: '#/components/schemas/shared-hook-signal'
        signals:
          $ref: '#/components/schemas/shared-hook-signals'
      oneOf:
        - required:
            - signals
        - required:
            - signal
    hook-shift_seq:
      type: object
      required:
        - type
        - offset
      additionalProperties: false
      properties:
        type:
          type: string
          const: shift_seq
        offset:
          type: integer
          description: The offset which is added to the sequence number of each processed sample.
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    hook-shift_ts:
      type: object
      required:
        - type
        - offset
      additionalProperties: false
      properties:
        type:
          type: string
          const: shift_ts
        mode:
          type: string
          enum:
            - origin
            - received
          description: The timestamp field which should be adjusted by the `offset` setting.
        offset:
          type: number
          description: The offset in seconds which is added to the timestamp field of each processed sample.
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    hook-skip_first:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: skip_first
        samples:
          type: integer
          description: The number of samples which should be dropped by this hook after a start or restart of the node/path.
        seconds:
          type: number
          description: The number of seconds for which this hook should initially drop samples after a start or restart of the node/path.
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
      oneOf:
        - required:
            - samples
        - required:
            - seconds
    hook-stats:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: stats
        format:
          type: string
          enum:
            - human
            - json
            - matlab
        buckets:
          type: integer
          default: 20
          description: The number of buckets which should be used for the underlying histograms.
        warmup:
          type: integer
          default: 500
          description: Use the first `warmup` samples to estimate the bucket range of the underlying histograms.
        verbose:
          type: boolean
          default: false
          description: Include full dumps of the histogram buckets into the output.
        output:
          type: string
          description: The file where you want to write the report to. If omitted, stdout (the terminal) will be used.
          default: /dev/stdout
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    hook-ts:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: ts
        priority:
          default: 99
          $ref: '#/components/schemas/shared-hook-priority'
    hook:
      description: |
        Hooks form a pipeline of steps which process, filter or alter sample data.
      example: print
      type:
        - object
        - string
      discriminator:
        x-villas-expand: hook
        propertyName: type
        mapping:
          average: '#/components/schemas/hook-average'
          cast: '#/components/schemas/hook-cast'
          decimate: '#/components/schemas/hook-decimate'
          digest: '#/components/schemas/hook-digest'
          dp: '#/components/schemas/hook-dp'
          drop: '#/components/schemas/hook-drop'
          dump: '#/components/schemas/hook-dump'
          ebm: '#/components/schemas/hook-ebm'
          fix: '#/components/schemas/hook-fix'
          frame: '#/components/schemas/hook-frame'
          gate: '#/components/schemas/hook-gate'
          jitter_calc: '#/components/schemas/hook-jitter_calc'
          limit_rate: '#/components/schemas/hook-limit_rate'
          limit_value: '#/components/schemas/hook-limit_value'
          lua: '#/components/schemas/hook-lua'
          ma: '#/components/schemas/hook-ma'
          pmu_dft: '#/components/schemas/hook-pmu_dft'
          pps_ts: '#/components/schemas/hook-pps_ts'
          print: '#/components/schemas/hook-print'
          reorder_ts: '#/components/schemas/hook-reorder_ts'
          restart: '#/components/schemas/hook-restart'
          rms: '#/components/schemas/hook-rms'
          round: '#/components/schemas/hook-round'
          scale: '#/components/schemas/hook-scale'
          shift_seq: '#/components/schemas/hook-shift_seq'
          shift_ts: '#/components/schemas/hook-shift_ts'
          skip_first: '#/components/schemas/hook-skip_first'
          stats: '#/components/schemas/hook-stats'
          ts: '#/components/schemas/hook-ts'
    shared-hook-list:
      type: array
      title: Hook List
      example:
        - print
        - type: limit_rate
          rate: 1000
      items:
        $ref: '#/components/schemas/hook'
    shared-signal-description:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/shared-signal-name'
        unit:
          $ref: '#/components/schemas/shared-signal-unit'
        type:
          $ref: '#/components/schemas/shared-signal-type'
        init:
          $ref: '#/components/schemas/shared-signal-init'
        enabled:
          $ref: '#/components/schemas/shared-signal-enabled'
      additionalProperties: false
    shared-signal-list:
      description: List of signal definition objects
      type: array
      example:
        - name: tap_position
          type: integer
          init: 0
        - name: voltage
          type: float
          unit: V
          init: 230
      items:
        $ref: '#/components/schemas/shared-signal-description'
    shared-node-in:
      type: object
      properties:
        enabled:
          default: true
          $ref: '#/components/schemas/shared-node-enabled'
        builtin:
          default: true
          $ref: '#/components/schemas/shared-node-builtin'
        vectorize:
          default: 1
          $ref: '#/components/schemas/shared-node-vectorize'
        hooks:
          default: []
          $ref: '#/components/schemas/shared-hook-list'
        signals:
          $ref: '#/components/schemas/shared-signal-list'
      additionalProperties: false
    shared-node-netem:
      description: |
        The netem configuration allows the user to apply network impairments to packets send out by the nodes.

        Please note, that the network emulation feature is currently supported by the following node-types:
        - [`socket`](/docs/node/nodes/socket)
        - [`nanomsg`](/docs/node/nodes/nanomsg)
        - [`zeromq`](/docs/node/nodes/zeromq)
        - [`rtp`](/docs/node/nodes/rtp)
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: |
            Enable or disable the network emulation for this node.
        distribution:
          description: |
            One of the delay distributions supported by the `tc` command (see [tc-netem(8)](https://man7.org/linux/man-pages/man8/tc-netem.8.html)).
          oneOf:
            - type: string
              enum:
                - uniform
                - normal
                - pareto
                - paretonormal
            - type: array
              items:
                type: integer
        correlation:
          type: number
          minimum: 0
          maximum: 100
        limit:
          type: integer
          minimum: 1
        delay:
          description: |
            Delay packets in microseconds.
          type: integer
          minimum: 1
        jitter:
          title: Jitter
          description: |
            Apply a jitter to the packet delay (in microseconds).
          type: integer
          minimum: 1
        loss:
          title: Packet Loss Percentage
          description: |
            Percentage of packets which will be dropped.
          type: number
          minimum: 0
          maximum: 100
        duplicate:
          title: Packet Duplication Percentage
          description: |
            Percentage of packets which will be duplicated.
          type: number
          minimum: 0
          maximum: 100
        corruption:
          title: Packet Corruption Percentage
          description: |
            Percentage of packets which will be corrupted.
          type: number
          minimum: 0
          maximum: 100
      additionalProperties: false
    shared-node-fwmark:
      type: integer
      minimum: 1
      description: |
        Firewall mark (fwmark) which is applied to all outgoing packets of this node.

        This can be used together with the `tc` traffic control subsystem (see also `netem`)
        to classify and shape the traffic emitted by this node.
    shared-node-out:
      type: object
      properties:
        enabled:
          default: true
          $ref: '#/components/schemas/shared-node-enabled'
        netem:
          $ref: '#/components/schemas/shared-node-netem'
        fwmark:
          $ref: '#/components/schemas/shared-node-fwmark'
        builtin:
          default: true
          $ref: '#/components/schemas/shared-node-builtin'
        vectorize:
          default: 1
          $ref: '#/components/schemas/shared-node-vectorize'
        hooks:
          default: []
          $ref: '#/components/schemas/shared-hook-list'
        signals:
          $ref: '#/components/schemas/shared-signal-list'
      additionalProperties: false
    node-amqp:
      title: Advanced Messaging & Queuing Protocol (AMQP)
      type: object
      required:
        - type
        - exchange
        - routing_key
      properties:
        type:
          type: string
          const: amqp
        format:
          $ref: '#/components/schemas/format'
        uri:
          type: string
          format: uri
          example: amqp://guest:guest@localhost:5672/
          description: |
            A complete AMQP connection URI.

            If set, it takes precedence over the individual `host`, `port`, `username`, `password` and `vhost` settings, which are otherwise used to construct the URI.

            See also: https://www.rabbitmq.com/uri-spec.html
        host:
          type: string
          default: localhost
          description: |
            The hostname of the AMQP broker.
            Used to construct the connection URI when `uri` is not set.
        port:
          type: integer
          default: 5672
          description: |
            The port number of the AMQP broker.
            Used to construct the connection URI when `uri` is not set.
        username:
          type: string
          default: guest
          description: |
            The username used for authentication with the AMQP broker.
            Used to construct the connection URI when `uri` is not set.
        password:
          type: string
          default: guest
          description: |
            The password used for authentication with the AMQP broker.
            Used to construct the connection URI when `uri` is not set.
        vhost:
          type: string
          default: /
          description: |
            The AMQP virtual host.
            Used to construct the connection URI when `uri` is not set.
        exchange:
          type: string
          description: |
            The name of the AMQP exchange the node will publish the messages to.
        routing_key:
          type: string
          description: |
            The routing key of published messages as well as the routing key which is used to bind the subcriber queue.
        ssl:
          description: |
            Note: These settings are only used if the `uri` setting is using the `amqps://` schema.
          type: object
          properties:
            verify_hostname:
              type: boolean
              default: true
            verify_peer:
              type: boolean
              default: true
            ca_cert:
              type: string
              description: Path to a CA certificate file used to verify the broker.
            client_cert:
              type: string
              description: Path to the client certificate file.
            client_key:
              type: string
              description: Path to the client private key file.
          additionalProperties: false
        in:
          $ref: '#/components/schemas/shared-node-in'
        out:
          $ref: '#/components/schemas/shared-node-out'
      additionalProperties: false
    node-c37.118-phasor:
      type: object
      description: |
        Configuration of a single phasor channel.
      required:
        - signal
        - unit
      properties:
        signal:
          type: string
          description: |
            Name of the input signal mapped to this phasor (server direction).
        name:
          type: string
          maxLength: 255
          description: |
            Name of the phasor channel. Defaults to the signal name. Clients using
            revision 2005 of the protocol might see the name truncated to 16
            characters.
        unit:
          type: string
          enum:
            - volt
            - ampere
          description: |
            Physical unit of the phasor.
        component:
          type: string
          default: phase_a
          enum:
            - zero_sequence
            - positive_sequence
            - negative_sequence
            - phase_a
            - phase_b
            - phase_c
          description: |
            The phasor component (sequence or phase) that this phasor represents.
        modifications:
          type: array
          uniqueItems: true
          description: |
            Measurement modifications applied to the phasor (CONFIG3 only).
          items:
            type: string
            enum:
              - upsampled_with_interpolation
              - upsampled_with_extrapolation
              - downsampled_with_reselection
              - downsampled_with_fir_filter
              - downsampled_with_non_fir_filter
              - filtered_without_resampling
              - magnitude_adjusted_for_calibration
              - phase_adjusted_for_calibration
              - phase_adjusted_for_rotation
              - pseudo_phasor_value
              - other
      additionalProperties: false
    node-c37.118-analog:
      type: object
      description: |
        Configuration of a single analog channel.
      required:
        - signal
      properties:
        signal:
          type: string
          description: |
            Name of the input signal mapped to this analog channel (server
            direction).
        name:
          type: string
          maxLength: 255
          description: |
            Name of the analog channel. Defaults to the signal name. Clients using
            revision 2005 of the protocol might see the name truncated to 16
            characters.
        unit:
          type: string
          default: point_on_wave
          enum:
            - point_on_wave
            - rms
            - peak
          description: |
            Type of the analog value.
      additionalProperties: false
    node-c37.118-digital:
      type: object
      description: |
        Configuration of a single digital status bit. Every 16 bits form one
        digital status word.
      required:
        - signal
      properties:
        signal:
          type: string
          description: |
            Name of the input signal mapped to this bit (server direction).
        name:
          type: string
          maxLength: 255
          description: |
            Name of the bit. Defaults to the signal name. Clients using revision
            2005 of the protocol might see the name truncated to 16 characters.
        normal:
          type: boolean
          default: false
          description: |
            Normal state of the digital status bit.
      additionalProperties: false
    node-c37.118-pmu:
      type: object
      description: |
        Configuration of a single PMU.
      required:
        - name
        - frequency
        - rocof
      properties:
        name:
          type: string
          maxLength: 255
          description: |
            Station name of the PMU. Clients using revision 2005 of the protocol
            might see the name truncated to 16 characters.
        idcode:
          type: integer
          default: 1
          minimum: 0
          maximum: 65535
          description: |
            Data stream ID code of the PMU.
        guid:
          type: string
          format: uuid
          description: |
            Global PMU identifier. Defaults to the node's UUID.
        nominal_frequency:
          type: number
          enum:
            - 50
            - 60
          default: 50
          description: |
            Nominal line frequency in Hz.
        latitude:
          type: number
          description: |
            Latitude of the PMU in degrees (CONFIG3 only). Defaults to unknown.
        longitude:
          type: number
          description: |
            Longitude of the PMU in degrees (CONFIG3 only). Defaults to unknown.
        elevation:
          type: number
          description: |
            Elevation of the PMU in meters (CONFIG3 only). Defaults to unknown.
        service_class:
          type: string
          default: measurement
          enum:
            - measurement
            - protection
          description: |
            Performance/service class of the PMU (CONFIG3 only). `measurement`
            maps to service class M, `protection` to service class P.
        window:
          type: integer
          default: 0
          minimum: 0
          description: |
            Phasor measurement window length in microseconds (CONFIG3 only).
        group_delay:
          type: integer
          default: 0
          minimum: 0
          description: |
            Phasor measurement group delay in microseconds (CONFIG3 only).
        frequency:
          type: string
          description: |
            Name of the input signal providing the measured frequency (server
            direction only).
        rocof:
          type: string
          description: |
            Name of the input signal providing the rate of change of frequency
            (server direction only).
        phasor:
          type: array
          items:
            $ref: '#/components/schemas/node-c37.118-phasor'
          description: |
            The phasor channels of the PMU.
        analog:
          type: array
          items:
            $ref: '#/components/schemas/node-c37.118-analog'
          description: |
            The analog channels of the PMU.
        digital:
          type: array
          items:
            $ref: '#/components/schemas/node-c37.118-digital'
          description: |
            The digital status bits of the PMU. Every 16 bits form one digital
            status word.
      additionalProperties: false
    node-c37_118:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: c37.118
        in:
          type: object
          required:
            - address
          description: |
            Client (PDC) side. When an address is given, the node connects to a
            remote PMU / PDC, requests its configuration and reads data frames.
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
            address:
              type: string
              description: |
                Hostname or IP address of the remote PMU / PDC in the format
                `host[:port]`. The port defaults to the C37.118 port 4712 when
                omitted.
            idcode:
              type: integer
              default: 1
              minimum: 0
              maximum: 65535
              description: |
                IDCODE placed in the command frames sent to the remote device.
          additionalProperties: false
        out:
          type: object
          required:
            - address
            - data_rate
            - pmus
          description: |
            Server (PMU / PDC) side. When an address is given, the node listens for
            a connecting PDC, answers configuration and command frames and streams
            data frames built from the samples written to the node.
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            netem:
              $ref: '#/components/schemas/shared-node-netem'
            fwmark:
              $ref: '#/components/schemas/shared-node-fwmark'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
            address:
              type: string
              description: |
                Local address to bind to in the format `host[:port]`. An empty host
                binds to all interfaces. The port defaults to the C37.118 port 4712
                when omitted.
            idcode:
              type: integer
              default: 1
              minimum: 0
              maximum: 65535
              description: |
                IDCODE reported in the frames served to the connecting PDC.
            testing:
              type: boolean
              default: false
              description: |
                Enable "testing" mode. This is only intended to be used by our
                integration tests.

                This causes the server to not discard samples when no client is
                connected. This option effectively makes the server busy-wait
                for a client to connect and can easily exhaust the internal
                queue of sent samples.
            time_base:
              type: integer
              default: 1000000
              minimum: 1
              maximum: 16777215
              description: |
                Resolution of the fractional second (FRACSEC) timestamp, i.e. the
                number of sub-second units per second. The C37.118 TIME_BASE field
                is 24 bits wide, so the value must not exceed 16777215.
            data_rate:
              type: number
              minimum: 0.0000305175
              maximum: 32767
              description: |
                Reporting rate in frames per second. Rates below one frame per
                second are supported (e.g. 0.5 for one frame every two seconds) and
                are encoded using the C37.118 seconds-per-frame representation.
            pmus:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/node-c37.118-pmu'
              description: |
                The list of PMU configurations served by this node.
          additionalProperties: false
      additionalProperties: false
      definitions:
        node-c37.118-pmu:
          type: object
          description: |
            Configuration of a single PMU.
          required:
            - name
            - frequency
            - rocof
          properties:
            name:
              type: string
              maxLength: 255
              description: |
                Station name of the PMU. Clients using revision 2005 of the protocol
                might see the name truncated to 16 characters.
            idcode:
              type: integer
              default: 1
              minimum: 0
              maximum: 65535
              description: |
                Data stream ID code of the PMU.
            guid:
              type: string
              format: uuid
              description: |
                Global PMU identifier. Defaults to the node's UUID.
            nominal_frequency:
              type: number
              enum:
                - 50
                - 60
              default: 50
              description: |
                Nominal line frequency in Hz.
            latitude:
              type: number
              description: |
                Latitude of the PMU in degrees (CONFIG3 only). Defaults to unknown.
            longitude:
              type: number
              description: |
                Longitude of the PMU in degrees (CONFIG3 only). Defaults to unknown.
            elevation:
              type: number
              description: |
                Elevation of the PMU in meters (CONFIG3 only). Defaults to unknown.
            service_class:
              type: string
              default: measurement
              enum:
                - measurement
                - protection
              description: |
                Performance/service class of the PMU (CONFIG3 only). `measurement`
                maps to service class M, `protection` to service class P.
            window:
              type: integer
              default: 0
              minimum: 0
              description: |
                Phasor measurement window length in microseconds (CONFIG3 only).
            group_delay:
              type: integer
              default: 0
              minimum: 0
              description: |
                Phasor measurement group delay in microseconds (CONFIG3 only).
            frequency:
              type: string
              description: |
                Name of the input signal providing the measured frequency (server
                direction only).
            rocof:
              type: string
              description: |
                Name of the input signal providing the rate of change of frequency
                (server direction only).
            phasor:
              type: array
              items:
                $ref: '#/components/schemas/node-c37.118-phasor'
              description: |
                The phasor channels of the PMU.
            analog:
              type: array
              items:
                $ref: '#/components/schemas/node-c37.118-analog'
              description: |
                The analog channels of the PMU.
            digital:
              type: array
              items:
                $ref: '#/components/schemas/node-c37.118-digital'
              description: |
                The digital status bits of the PMU. Every 16 bits form one digital
                status word.
          additionalProperties: false
        node-c37.118-phasor:
          type: object
          description: |
            Configuration of a single phasor channel.
          required:
            - signal
            - unit
          properties:
            signal:
              type: string
              description: |
                Name of the input signal mapped to this phasor (server direction).
            name:
              type: string
              maxLength: 255
              description: |
                Name of the phasor channel. Defaults to the signal name. Clients using
                revision 2005 of the protocol might see the name truncated to 16
                characters.
            unit:
              type: string
              enum:
                - volt
                - ampere
              description: |
                Physical unit of the phasor.
            component:
              type: string
              default: phase_a
              enum:
                - zero_sequence
                - positive_sequence
                - negative_sequence
                - phase_a
                - phase_b
                - phase_c
              description: |
                The phasor component (sequence or phase) that this phasor represents.
            modifications:
              type: array
              uniqueItems: true
              description: |
                Measurement modifications applied to the phasor (CONFIG3 only).
              items:
                type: string
                enum:
                  - upsampled_with_interpolation
                  - upsampled_with_extrapolation
                  - downsampled_with_reselection
                  - downsampled_with_fir_filter
                  - downsampled_with_non_fir_filter
                  - filtered_without_resampling
                  - magnitude_adjusted_for_calibration
                  - phase_adjusted_for_calibration
                  - phase_adjusted_for_rotation
                  - pseudo_phasor_value
                  - other
          additionalProperties: false
        node-c37.118-analog:
          type: object
          description: |
            Configuration of a single analog channel.
          required:
            - signal
          properties:
            signal:
              type: string
              description: |
                Name of the input signal mapped to this analog channel (server
                direction).
            name:
              type: string
              maxLength: 255
              description: |
                Name of the analog channel. Defaults to the signal name. Clients using
                revision 2005 of the protocol might see the name truncated to 16
                characters.
            unit:
              type: string
              default: point_on_wave
              enum:
                - point_on_wave
                - rms
                - peak
              description: |
                Type of the analog value.
          additionalProperties: false
        node-c37.118-digital:
          type: object
          description: |
            Configuration of a single digital status bit. Every 16 bits form one
            digital status word.
          required:
            - signal
          properties:
            signal:
              type: string
              description: |
                Name of the input signal mapped to this bit (server direction).
            name:
              type: string
              maxLength: 255
              description: |
                Name of the bit. Defaults to the signal name. Clients using revision
                2005 of the protocol might see the name truncated to 16 characters.
            normal:
              type: boolean
              default: false
              description: |
                Normal state of the digital status bit.
          additionalProperties: false
    node-can-signal:

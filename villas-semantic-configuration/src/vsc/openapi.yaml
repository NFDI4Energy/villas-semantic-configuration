          default: auto
          description: Specify the synchronization mode of the internal queue.
        in:
          $ref: '#/components/schemas/shared-node-in'
        out:
          $ref: '#/components/schemas/shared-node-out'
      additionalProperties: false
    node-modbus-signal:
      type: object
      required:
        - address
      properties:
        address:
          type: integer
          description: The modbus register address.
        integer_registers:
          type: integer
          description: |
            The number of consecutive registers combined into a single integer value.
          minimum: 1
          maximum: 4
        word_endianess:
          type: string
          enum:
            - big
            - little
          description: The ordering of two modbus registers joined together to form a larger number.
          default: big
        byte_endianess:
          type: string
          enum:
            - big
            - little
          description: The ordering of the bytes within a modbus register.
          default: big
        scale:
          type: number
          description: The scale of the register's value.
          default: 1
        offset:
          type: number
          description: The offset of the register's value.
          default: 0
        bit:
          type: integer
          description: The bit index within a register.
          minimum: 0
          maximum: 15
        name:
          $ref: '#/components/schemas/shared-signal-name'
        unit:
          $ref: '#/components/schemas/shared-signal-unit'
        type:
          $ref: '#/components/schemas/shared-signal-type'
        init:
          $ref: '#/components/schemas/shared-signal-init'
        enabled:
          $ref: '#/components/schemas/shared-signal-enabled'
      additionalProperties: false
    node-modbus:
      title: Read and write Modbus registers
      type: object
      required:
        - type
        - transport
      properties:
        type:
          type: string
          const: modbus
        transport:
          type: string
          description: The transport protocol used for Modbus communication.
          enum:
            - tcp
            - rtu
        response_timeout:
          type: number
          description: The timeout in seconds when waiting for responses from a Modbus server.
          default: 1
          example: 1
        reconnect_interval:
          type: number
          description: The interval in seconds for trying to reconnect on connection loss.
          default: 10
        min_block_usage:
          type: number
          description: |
            The minimum ratio of used registers to queried registers for a merged block of registers.
            This caps the amount of unnecessary data transmitted.
          default: 0.25
        max_block_size:
          type: integer
          description: The maximum size (in registers) of a merged block of register mappings.
          default: 32
        rate:
          type: number
          description: The rate at which Modbus device registers are queried for changes.
          example: 1
        remote:
          type: string
          description: The hostname or IP of the Modbus TCP device. Only used with `transport = tcp`.
          example: example.com
        port:
          type: integer
          description: The port number of the Modbus TCP device. Only used with `transport = tcp`.
          default: 502
        device:
          type: string
          description: Path to the serial device file. Only used with `transport = rtu`.
          example: /dev/ttyS0
        baudrate:
          type: integer
          description: The baudrate used for serial communication. Only used with `transport = rtu`.
          example: 9600
        parity:
          type: string
          enum:
            - none
            - even
            - odd
          description: The parity used for serial communication. Only used with `transport = rtu`.
          example: none
        data_bits:
          type: integer
          description: The data bits used for serial communication. Only used with `transport = rtu`.
          minimum: 5
          maximum: 8
          example: 5
        stop_bits:
          type: integer
          description: The stop bits used for serial communication. Only used with `transport = rtu`.
          minimum: 1
          maximum: 2
          example: 1
        unit:
          type: integer
          description: The addressed unit used for communication. Optional for TCP.
          minimum: 0
          maximum: 65535
          example: 1
        in:
          type: object
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              type: array
              items:
                $ref: '#/components/schemas/node-modbus-signal'
          additionalProperties: false
        out:
          type: object
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            netem:
              $ref: '#/components/schemas/shared-node-netem'
            fwmark:
              $ref: '#/components/schemas/shared-node-fwmark'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              type: array
              items:
                $ref: '#/components/schemas/node-modbus-signal'
          additionalProperties: false
      additionalProperties: false
      definitions:
        node-modbus-signal:
          type: object
          required:
            - address
          properties:
            address:
              type: integer
              description: The modbus register address.
            integer_registers:
              type: integer
              description: |
                The number of consecutive registers combined into a single integer value.
              minimum: 1
              maximum: 4
            word_endianess:
              type: string
              enum:
                - big
                - little
              description: The ordering of two modbus registers joined together to form a larger number.
              default: big
            byte_endianess:
              type: string
              enum:
                - big
                - little
              description: The ordering of the bytes within a modbus register.
              default: big
            scale:
              type: number
              description: The scale of the register's value.
              default: 1
            offset:
              type: number
              description: The offset of the register's value.
              default: 0
            bit:
              type: integer
              description: The bit index within a register.
              minimum: 0
              maximum: 15
            name:
              $ref: '#/components/schemas/shared-signal-name'
            unit:
              $ref: '#/components/schemas/shared-signal-unit'
            type:
              $ref: '#/components/schemas/shared-signal-type'
            init:
              $ref: '#/components/schemas/shared-signal-init'
            enabled:
              $ref: '#/components/schemas/shared-signal-enabled'
          additionalProperties: false
    node-mqtt:
      type: object
      required:
        - type
        - host
      properties:
        type:
          type: string
          const: mqtt
        format:
          default: json
          $ref: '#/components/schemas/format'
        username:
          type: string
          description: The username which is used for authentication with the MQTT broker.
        password:
          type: string
          description: The password which is used for authentication with the MQTT broker.
        host:
          type: string
          description: The hostname of the MQTT broker.
          example: example.com
        port:
          type: integer
          description: The port number of the MQTT broker.
          default: 1883
        retain:
          type: boolean
          description: Set to true to make the will a retained message.
          default: false
        keepalive:
          type: integer
          default: 5
          description: The MQTT keepalive value.
        qos:
          type: integer
          default: 0
          description: The quality of service (QoS) to use for the subscription.
        ssl:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
            insecure:
              type: boolean
            cafile:
              type: string
              description: Path to a file containing the PEM encoded trusted CA certificate file.
            capath:
              type: string
              description: Path to a directory containing the PEM encoded trusted CA certificate files.
            certfile:
              type: string
              description: Path to a file containing the PEM encoded certificate file for this client.
            keyfile:
              type: string
              description: Path to a file containing the PEM encoded private key for this client.
            cipher:
              type: string
              description: A string describing the ciphers available for use. See the `openssl ciphers` tool for more information.
            verify:
              type: boolean
              default: true
              description: |
                Configure verification of the server hostname in the server certificate.
                If value is set to true, it is impossible to guarantee that the host you are connecting to is not impersonating your server.
                This can be useful in initial server testing, but makes it possible for a malicious third party to impersonate your server through DNS spoofing, for example.
                Do not use this function in a real system.
                Setting value to true makes the connection encryption pointless.
            tls_version:
              type: string
              enum:
                - tlsv1
                - tlsv1.1
                - tlsv1.2
              description: |
                The version of the SSL/TLS protocol to use as a string.
                If not set, the default value is used. The default value and the available values depend on the version of openssl that the library was compiled against.
                For openssl >= 1.0.1, the available options are tlsv1.2, tlsv1.1 and tlsv1, with tlv1.2 as the default.
                For openssl < 1.0.1, only tlsv1 is available.
          additionalProperties: false
        in:
          type: object
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            subscribe:
              type: string
              description: Topic to which this node subscribes.
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
          additionalProperties: false
        out:
          type: object
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            publish:
              type: string
              description: Topic to which this node publishes.
            netem:
              $ref: '#/components/schemas/shared-node-netem'
            fwmark:
              $ref: '#/components/schemas/shared-node-fwmark'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
          additionalProperties: false
      additionalProperties: false
    node-nanomsg:

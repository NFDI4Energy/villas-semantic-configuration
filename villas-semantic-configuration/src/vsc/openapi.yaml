      type: object
      required:
        - type
        - exec
      properties:
        type:
          type: string
          const: exec
        format:
          default: villas.human
          $ref: '#/components/schemas/format'
        shell:
          type: boolean
          default: false
          description: |
            If set, the `exec` setting gets passed the shell (`/usr/bin`).
            In this case the `exec` setting must be given as a string.

            If not set, we will directly execute the sub-process via `execvpe(2)`.
            In this case the exec setting must be given as an array (`argv[]`).
        exec:
          description: |
            The program which should be executed in the sub-process.

            The option is passed to the system shell for execution.
          oneOf:
            - type: array
              minItems: 1
              items:
                type: string
            - type: string
        flush:
          type: boolean
          default: true
          description: |
            Flush stream every time VILLASnode passes data the sub-process.
        working_directory:
          type: string
          description: |
            If set, the working directory for the sub-process will be changed.
        environment:
          type: object
          description: |
            A object of key/value pairs of environment variables which should be passed to the sub-process in addition to the parent environment.
          additionalProperties:
            type: string
        in:
          $ref: '#/components/schemas/shared-node-in'
        out:
          $ref: '#/components/schemas/shared-node-out'
      additionalProperties: false
    node-file:
      title: File
      type: object
      required:
        - type
        - uri
      properties:
        type:
          type: string
          const: file
        format:
          default: villas.human
          $ref: '#/components/schemas/format'
        uri:
          type: string
          description: |
            Specifies the path to a local file which is written to or read from depending on which group (`in` or `out`) is used.

            This setting allows to add special placeholders for time and date values.
            See [strftime(3)](http://man7.org/linux/man-pages/man3/strftime.3.html) for a list of supported placeholder.

            **Example**:

            ```
            uri = "logs/measurements_%Y-%m-%d_%H-%M-%S.log"
            ```

            will create a file called:

            ```
            ./logs/measurements_2015-08-09_22-20-50.log
            ```
        in:
          type: object
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
            epoch:
              type: number
            epoch_mode:
              type: string
              enum:
                - direct
                - wait
                - relative
                - absolute
                - original
              description: "The *epoch* describes the point in time when the first message will be read from the file.\nThis setting allows to select the behavior of the following `epoch` setting.\nIt can be used to adjust the point in time when the first value should be read.\n\nThe behavior of `epoch` is depending on the value of `epoch_mode`.\n\nTo facilitate the following description of supported `epoch_mode`'s, we will introduce some intermediate variables (timestamps).\nThose variables will also been displayed during the startup phase of the server to simplify debugging.\n\n- `epoch` is the value of the `epoch` setting.\n- `first` is the timestamp of the first message / line in the input file.\n- `offset` will be added to the timestamps in the file to obtain the real time when the message will be sent.\n- `start` is the point in time when the first message will be sent (`first + offset`).\n- `eta` the time to wait until the first message will be send (`start - now`)\n\nThe supported values for `epoch_mode`:\n\n| `epoch_mode` \t| `offset` \t\t| `start = first + offset` |\n| :--\t\t| :--\t\t\t| :-- |\n| `direct`  \t| `now - first + epoch` \t| `now + epoch` |\n| `wait`  \t| `now + epoch` \t\t| `now + first` |\n| `relative` \t| `epoch` \t\t| `first + epoch` |\n| `absolute` \t| `epoch - first` \t| `epoch` |\n| `original` \t| `0` \t\t\t| immediately |\n"
            rate:
              type: number
              default: 0
              description: |
                By default `send_rate` has the value `0` which means that the time between consecutive samples is the same as in the `in` file based on the timestamps in the first column.

                If this setting has a non-zero value, the default behavior is overwritten with a fixed rate.
            eof:
              type: string
              default: exit
              enum:
                - rewind
                - wait
                - exit
                - stop
              description: |
                Defines the behavior if the end of file of the input file is reached.

                - `rewind` will rewind the file pointer and restart reading samples from the beginning of the file.
                - `exit` will terminated the program.
                - `wait` will periodically test if there are new samples which have been appended to the file.
            buffer_size:
              type: integer
              minimum: 0
              default: 0
              description: |
                Similar to the [`out.buffer_size` setting](#out-buffer_size). This means that the data is loaded into the buffer before it is passed on to the node.

                If `in.buffer_size = 0`, no buffer will be generated.
            skip:
              type: integer
              minimum: 0
              default: 0
              description: |
                The number of lines which should be skipped at the beginning of the input file.
          additionalProperties: false
        out:
          type: object
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            netem:
              $ref: '#/components/schemas/shared-node-netem'
            fwmark:
              $ref: '#/components/schemas/shared-node-fwmark'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
            flush:
              type: boolean
              description: |
                With this setting enabled, the outgoing file is flushed whenever new samples have been written to it.
            buffer_size:
              type: integer
              default: 0
              minimum: 0
              description: |
                If this is set to a positive value `<X>`, the node will generate a full [stream buffer](https://linux.die.net/man/3/setvbuf) with a size of `<X>` bytes. This means that the data is buffered and not written until the buffer is full or until the node is stopped.

                If `out.buffer_size = 0`, no buffer will be generated.
          additionalProperties: false
      additionalProperties: false

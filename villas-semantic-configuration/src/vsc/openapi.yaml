openapi: 3.1.0
info:
  title: VILLAS Semantic Conf API - OpenAPI 3.1
  description: |-
    This is a minimalistic API to convert JSON based VILLAS node configuration files to it RDF counterpart.
    It uses the OpenAPI 3.1 specification.
  termsOfService: http://swagger.io/terms/
  contact:
    email: philipp.schmurr@kit.edu
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
servers:
  - url: http://localhost:8080
tags:
  - name: semantics
    description: Semantic Web Related Topic
    externalDocs:
      description: RDF Spec
      url: https://rdf.spec
externalDocs:
  description: VILLAS Node configuration
  url: https://some/villas/uri
paths:
  /semantify-file:
    post:
      tags:
        - semantics
      summary: Convert JSON configuration file to semantic counterpart in RDF
      description: |-
        This endpoint takes an octet-stream and attempts to parse JSON from it and then attempts the conversion to RDF.
        The result is an octet-stream that includes the RDF version.
        Serialization format can be decided via query parameters.
      operationId: semantify_file
      parameters:
        - $ref: '#/components/parameters/output-mime-type'
      requestBody:
        description: The binary string containing the JSON file
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: invalid JSON configuration input file
          content:
            text/plain:
              schema:
                type: string
  /semantify-json:
    post:
      tags:
        - semantics
      summary: Insert a new data source meta record
      description: |-
        This endpoint takes the VILLAS configuration as a JSON string.
        It performs schema validation against the official VILLAS node configuration schema.
        Different RDF serializations can be picked using the Accept Header.
      operationId: semantify_json
      requestBody:
        description: JSON string that conforms to VILLAS node configuration
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/config'
      responses:
        '200':
          description: successful operation
          content:
            text/turtle:
              schema:
                type: string
        '400':
          description: Invalid JSON configuration input
          content:
            text/plain:
              schema:
                type: string
  /jsonld-context:
    get:
      tags:
        - semantics
      summary: Get the jsonld context to be used with the jsonld version from this API
      description: This endpoint provides the JSON LD context needed when working with the JSON LD output of this API.
      operationId: jsonld_context
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
components:
  parameters:
    output-mime-type:
      name: output-mime-type
      in: query
      schema:
        type: string
        default: text/turtle
      required: false
  schemas:
    VillasConfig:
      $ref: '#/components/schemas/config'
    plugin-ethercat:
      $schema: http://json-schema.org/draft-07/schema
      description: Global EtherCAT master configuration
      type: object
      properties:
        master:
          type: integer
        alias:
          type: integer
        coupler:
          type: object
          properties:
            position:
              type: integer
            product_code:
              type: integer
            vendor_id:
              type: integer
          additionalProperties: false
      additionalProperties: false
    shared-fpga-card:
      description: FPGA Card configuration
      type: object
      required:
        - interface
      properties:
        interface:
          type: string
          enum:
            - pcie
            - platform
        name:
          type: string
        ips:
          type: string
        affinity:
          type: integer
        do_reset:
          type: boolean
        slot:
          type: string
        id:
          type: string
        polling:
          type: boolean
        paths:
          type: array
          items:
            type: object
            required:
              - from
              - to
            properties:
              from:
                type: string
              to:
                type: string
              reverse:
                type: boolean
            additionalProperties: false
        ignore_ips:
          type: array
          items:
            type: string
      additionalProperties: false
    plugin-fpgas:
      $schema: http://json-schema.org/draft-07/schema
      description: Global FPGA configuration
      type: object
      additionalProperties:
        allOf:
          - $ref: '#/components/schemas/shared-fpga-card'
          - not:
              required:
                - name
    shared-format-column-separator:
      title: Column Separator
      type: string
      pattern: ^[\x00-\x7F]$
      description: |
        Separator between entries in column-based formats.
    shared-format-line-delimiter:
      title: Line Delimiter
      type: string
      pattern: ^[\x00-\x7F]$
      description: |
        Delimiter following rows in line-based formats.
    shared-format-line-comment_prefix:
      title: Line Comment Prefix
      type: string
      pattern: ^[\x00-\x7F]$
      description: |
        Prefix indicating that a row in line-based format should be treated as a comment.
    shared-format-line-header:
      title: First Line Header
      type: boolean
      description: |
        Print a single header-row at the beginning of a line-based format.
    shared-format-line-skip_first_line:
      title: Skip First Line
      type: boolean
      description: |
        Skip the first row in a line-based format.
    shared-format-real_precision:
      title: Floating Point Decimal Precision
      type: integer
      minimum: 0
      maximum: 31
      description: |
        Output all real numbers with at most n digits of precision.
        A precision of 17 is sufficient to correctly and losslessly encode all IEEE 754 double precision floating point numbers.
    shared-format-ts_origin:
      title: Include Origin Timestamp
      type: boolean
      description: |
        Include a timestamp recorded at a sample's origin.
    shared-format-ts_received:
      title: Include Received Timestamp
      type: boolean
      description: |
        Include a timestamp recorded when a sample was received by a VILLASnode instance.
    shared-format-sequence:
      title: Include Sequence Number
      type: boolean
      description: |
        Include the sequence number of a sample.
    shared-format-data:
      title: Include Data
      type: boolean
      description: |
        Include sample data.
    shared-format-offset:
      title: Include Timestamp Offset
      type: boolean
      description: |
        Include difference between received and origin timestamp.
    format-csv:
      title: csv
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: csv
        separator:
          default: ','
          $ref: '#/components/schemas/shared-format-column-separator'
        delimiter:
          default: "\n"
          $ref: '#/components/schemas/shared-format-line-delimiter'
        comment_prefix:
          default: '#'
          $ref: '#/components/schemas/shared-format-line-comment_prefix'
        header:
          default: true
          $ref: '#/components/schemas/shared-format-line-header'
        skip_first_line:
          default: false
          $ref: '#/components/schemas/shared-format-line-skip_first_line'
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: true
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: true
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: true
          $ref: '#/components/schemas/shared-format-offset'
    shared-format-raw-bits:
      description: Number of bits per signal.
      type: integer
      enum:
        - 8
        - 16
        - 32
        - 64
        - 128
    shared-format-raw-endianess:
      description: The endianess of the data.
      type: string
      enum:
        - big
        - little
    shared-format-raw-fake:
      description: |
        Send and interpret the first three signals of each sample as the following header fields:
        - sequence number
        - timestamp seconds
        - timestamp nano-seconds
      type: boolean
    format-gtnet:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: gtnet
        bits:
          default: 32
          $ref: '#/components/schemas/shared-format-raw-bits'
        endianess:
          default: big
          $ref: '#/components/schemas/shared-format-raw-endianess'
        fake:
          default: false
          $ref: '#/components/schemas/shared-format-raw-fake'
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: false
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: false
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    format-iotagent_ul:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: iotagent_ul
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: true
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: true
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    shared-format-json-indent:
      type: integer
      minimum: 0
      maximum: 31
      description: |
        Pretty-print the result, using newlines between array and object items, and indenting with n spaces.
        If the settings is not used or is 0, no newlines are inserted between array and object items.
    shared-format-json-compact:
      type: boolean
      description: |
        This flag enables a compact representation, i.e. sets the separator between array and object items to "," and between object keys and values to ":".
        Without this flag, the corresponding separators are ", " and ": " for more readable output.
    shared-format-json-ensure_ascii:
      type: boolean
      description: |
        If this flag is used, the output is guaranteed to consist only of ASCII characters.
        This is achieved by escaping all Unicode characters outside the ASCII range.
    shared-format-json-sort_keys:
      type: boolean
      description: |
        If this flag is used, all the objects in output are sorted by key.
        This is useful e.g. if two JSON texts are diffed or visually compared.
    shared-format-json-escape_slash:
      type: boolean
      default: false
      description: Escape the `/` characters in strings with `\/`.
    format-json:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: json
        indent:
          default: 0
          $ref: '#/components/schemas/shared-format-json-indent'
        compact:
          default: false
          $ref: '#/components/schemas/shared-format-json-compact'
        ensure_ascii:
          default: false
          $ref: '#/components/schemas/shared-format-json-ensure_ascii'
        sort_keys:
          default: false
          $ref: '#/components/schemas/shared-format-json-sort_keys'
        escape_slash:
          default: false
          $ref: '#/components/schemas/shared-format-json-escape_slash'
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: true
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: true
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    format-json_edgeflex:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: json.edgeflex
        indent:
          default: 0
          $ref: '#/components/schemas/shared-format-json-indent'
        compact:
          default: false
          $ref: '#/components/schemas/shared-format-json-compact'
        ensure_ascii:
          default: false
          $ref: '#/components/schemas/shared-format-json-ensure_ascii'
        sort_keys:
          default: false
          $ref: '#/components/schemas/shared-format-json-sort_keys'
        escape_slash:
          default: false
          $ref: '#/components/schemas/shared-format-json-escape_slash'
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: true
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: true
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    format-json_kafka:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: json.kafka
        schema:
          type: object
          additionalProperties: true
        indent:
          default: 0
          $ref: '#/components/schemas/shared-format-json-indent'
        compact:
          default: false
          $ref: '#/components/schemas/shared-format-json-compact'
        ensure_ascii:
          default: false
          $ref: '#/components/schemas/shared-format-json-ensure_ascii'
        sort_keys:
          default: false
          $ref: '#/components/schemas/shared-format-json-sort_keys'
        escape_slash:
          default: false
          $ref: '#/components/schemas/shared-format-json-escape_slash'
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: true
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: true
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    format-json_reserve:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: json.reserve
        indent:
          default: 0
          $ref: '#/components/schemas/shared-format-json-indent'
        compact:
          default: false
          $ref: '#/components/schemas/shared-format-json-compact'
        ensure_ascii:
          default: false
          $ref: '#/components/schemas/shared-format-json-ensure_ascii'
        sort_keys:
          default: false
          $ref: '#/components/schemas/shared-format-json-sort_keys'
        escape_slash:
          default: false
          $ref: '#/components/schemas/shared-format-json-escape_slash'
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: true
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: true
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    format-opal_asyncip:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: opal.asyncip
        dev_id:
          default: 0
          type: integer
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: false
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: true
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    format-protobuf:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: protobuf
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: true
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: true
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    format-raw:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: raw
        bits:
          default: 32
          $ref: '#/components/schemas/shared-format-raw-bits'
        endianess:
          default: little
          $ref: '#/components/schemas/shared-format-raw-endianess'
        fake:
          default: false
          $ref: '#/components/schemas/shared-format-raw-fake'
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: false
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:

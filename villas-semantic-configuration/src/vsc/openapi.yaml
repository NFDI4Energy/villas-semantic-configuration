        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:
          default: false
          $ref: '#/components/schemas/shared-format-sequence'
        data:
          default: true
          $ref: '#/components/schemas/shared-format-data'
        offset:
          default: false
          $ref: '#/components/schemas/shared-format-offset'
    shared-format-villas-source_index:
      title: Source Index
      description: |
        VILLASnode source index for outgoing messages.
        The source index of incoming messages will be verified against this value if `validate_source_index` is enabled.
      type: integer
      minimum: 0
    shared-format-villas-validate_source_index:
      title: Validate Source Index
      description: |
        Validate the source index of incoming messages.
      type: boolean
    format-villas_binary:
      type: object
      required:
        - type
      additionalProperties: false
      properties:
        type:
          type: string
          const: villas.binary
        source_index:
          default: 0
          $ref: '#/components/schemas/shared-format-villas-source_index'
        validate_source_index:
          default: false
          $ref: '#/components/schemas/shared-format-villas-validate_source_index'
        real_precision:
          default: 17
          $ref: '#/components/schemas/shared-format-real_precision'
        ts_origin:
          default: true
          $ref: '#/components/schemas/shared-format-ts_origin'
        ts_received:
          default: false
          $ref: '#/components/schemas/shared-format-ts_received'
        sequence:

          type: object
          required:
            - node_id_framework
            - segment_id
          properties:
            type:
              description: The type of connection to the OPAL-RT Orchestra framework.
              type: string
            node_id_framework:
              type: integer
              minimum: 4
              maximum: 4096
              description: Node ID for Dolphin node which hosts the Orchestra framework.
            segment_id:
              type: integer
              minimum: 1
              maximum: 65535
              description: Segment ID used to uniquely identify the framework domain. Note that another segment ID is automatically calculated outside of this range to identify the client segment.
          additionalProperties: false
        node-opal_orchestra-signal:
          type: object
          properties:
            orchestra_name:
              type: string
              description: Name of the corresponding Orchestra data item. Defaults to the VILLAS signal name.
            orchestra_type:
              type: string
              enum:
                - boolean
                - unsigned int8
                - unsigned int16
                - unsigned int32
                - unsigned int64
                - int8
                - int16
                - int32
                - int64
                - float32
                - float64
                - bus
              description: Type of the corresponding Orchestra data item. Defaults to a type derived from the VILLAS signal type.
            orchestra_index:
              type: integer
              minimum: 0
              description: Index of this signal within the Orchestra data item (for bus/array items).
            name:
              $ref: '#/components/schemas/shared-signal-name'
            unit:
              $ref: '#/components/schemas/shared-signal-unit'
            type:
              $ref: '#/components/schemas/shared-signal-type'
            init:
              $ref: '#/components/schemas/shared-signal-init'
            enabled:
              $ref: '#/components/schemas/shared-signal-enabled'
          additionalProperties: false
    node-opendss:
      title: Interface to OpenDSS, EPRI's Distribution System Simulator
      type: object
      required:
        - type
        - in
        - out
      properties:
        type:
          type: string
          const: opendss
        file_path:
          type: string
          description: |
            Specifies the URI to a OpenDSS file.
        in:
          type: object
          required:
            - list
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
            list:
              type: array
              items:
                type: object
                required:
                  - name
                  - type
                  - data
                properties:
                  name:
                    type: string
                    description: |
                      Name of the element.
                  type:
                    type: string
                    description: |
                      Type of the element.
                  data:
                    type: array
                    description: |
                      Data to be input. Possible options depend on the element type.
                    items:
                      type: string
                oneOf:
                  - title: Load or generator
                    properties:
                      type:
                        type: string
                        enum:
                          - load
                          - generator
                      data:
                        type: array
                        items:
                          enum:
                            - kV
                            - kW
                            - kVar
                            - Pf
                    additionalProperties: true
                  - title: Current source
                    properties:
                      type:
                        type: string
                        const: isource
                      data:
                        type: array
                        items:
                          enum:
                            - Amps
                            - AngleDeg
                            - Frequency

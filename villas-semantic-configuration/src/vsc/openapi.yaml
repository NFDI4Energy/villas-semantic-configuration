    node-webrtc:
      type: object
      required:
        - type
        - session
      properties:
        type:
          type: string
          const: webrtc
        format:
          default: villas.binary
          $ref: '#/components/schemas/format'
        wait_seconds:
          type: integer
          default: 0
          description: |
            Suspend start-up of VILLASnode for some seconds until the connection with the remote peer has been established.
        ordered:
          type: boolean
          default: false
          description: |
            Indicates if data is allowed to be delivered out of order.
            The default value of false, does not make guarantees that data will be delivered in order.
        max_retransmits:
          type: integer
          default: 0
          description: |
            Limit the number of times a channel will retransmit data if not successfully delivered.
            This value may be clamped if it exceeds the maximum value supported.
        session:
          type: string
          title: Session identifier
          description: A unique session identifier which must be shared between two nodes
        peer:
          type: string
          title: Peer identifier
          description: A unique peer identifier within the session. Defaults to the node UUID.
        server:
          type: string
          title: Signaling Server Address
          description: Address to the websocket signaling server
          default: wss://villas.k8s.eonerc.rwth-aachen.de/ws/signaling
        ice:
          type: object
          title: ICE configuration settings
          properties:
            servers:
              title: ICE Servers
              description: A list of ICE servers used for connection establishment
              type: array
              items:
                type: string
                format: uri
                title: STUN & TURN server URI
                description: |
                  A valid Uniform Resource Identifier (URI) identifying a STUN or TURN server.

                  See [RFC7064](https://datatracker.ietf.org/doc/html/rfc7064) and [RFC7065](https://datatracker.ietf.org/doc/html/rfc7065) for details.

                  As an extension to the URI format specified additional username & password can be specified as shown in the examples
            tcp:
              type: boolean
              title: Enable ICE over TCP
              description: Whether or not ICE candidates using the TCP transport should be gathered.
          additionalProperties: false
        in:
          $ref: '#/components/schemas/shared-node-in'
        out:
          $ref: '#/components/schemas/shared-node-out'
      additionalProperties: false
    node-websocket:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: websocket
        wait_connected:
          default: false
          type: boolean
        destinations:
          description: |
            During startup connect to those WebSocket servers as a client.

            Each URI must use the following scheme:

            ```
            protocol://host:port/nodename
            ```

            It starts with a protocol which must be one of `ws` (unencrypted) or `wss` (SSL).
            The host name or IP address is separated by `://`.
            The optional port number is separated by a colon `:`.
            The node name is separated by a slash `/`.
          type: array
          items:
            type: string
            format: uri
            description: A WebSocket URI
        in:
          $ref: '#/components/schemas/shared-node-in'
        out:
          $ref: '#/components/schemas/shared-node-out'
      additionalProperties: false
    node-zeromq:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: zeromq
        format:
          default: villas.binary
          $ref: '#/components/schemas/format'
        pattern:
          type: string
          enum:
            - pubsub
            - radiodish
          description: The ZeroMQ messaging pattern which is used by this node.
        ipv6:
          type: boolean
          default: false
        curve:
          title: CurveZMQ cryptography
          description: |
            **Note:** This feature is currently broken.

            You can use the [`villas zmq-keygen`](../usage/villas-zmq-keygen.md) command to create a new keypair for the following configuration options:
          type: object
          required:
            - public_key
            - secret_key
          properties:
            enabled:
              type: boolean
              description: Whether or not the encryption is enabled.
            public_key:
              type: string
              description: |
                The public key of the server.
            secret_key:
              type: string
              description: |
                The secret key of the server.
          additionalProperties: false
        in:
          type: object
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            subscribe:
              description: A single endpoint URI or list of URIs to which this node should connect as a subscriber.
              oneOf:
                - type: string
                  format: uri
                - type: array
                  items:
                    type: string
                    format: uri
            filter:
              type: string
              description: A filter which is used to select messages to receive.
            bind:
              type: boolean
              description: Whether this node binds to the endpoint instead of connecting to it.
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
          additionalProperties: false
        out:
          type: object
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            publish:
              description: A single endpoint URI or list of URIs on which this node should publish messages.
              oneOf:
                - type: string
                  format: uri
                - type: array
                  items:
                    type: string
                    format: uri
            filter:
              type: string
              description: A filter which is prepended to published messages.
            bind:
              type: boolean
              description: Whether this node binds to the endpoint instead of connecting to it.
            netem:
              $ref: '#/components/schemas/shared-node-netem'
            fwmark:
              $ref: '#/components/schemas/shared-node-fwmark'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
          additionalProperties: false
      additionalProperties: false
    node:
      $schema: http://json-schema.org/draft-07/schema
      type: object
      discriminator:
        x-villas-plugin: node
        propertyName: type
        mapping:
          amqp: '#/components/schemas/node-amqp'
          c37.118: '#/components/schemas/node-c37_118'
          can: '#/components/schemas/node-can'
          comedi: '#/components/schemas/node-comedi'
          ethercat: '#/components/schemas/node-ethercat'

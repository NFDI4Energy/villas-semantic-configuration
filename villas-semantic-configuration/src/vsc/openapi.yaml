              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
          additionalProperties: false
        out:
          type: object
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            endpoints:
              description: A single endpoint URI or list of URIs on which this node should listen for subscribers.
              oneOf:
                - type: string
                  format: uri
                - type: array
                  items:
                    type: string
                    format: uri
            netem:

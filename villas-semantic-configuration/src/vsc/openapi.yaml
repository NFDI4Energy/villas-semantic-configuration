            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
            netem:
              $ref: '#/components/schemas/shared-node-netem'
            fwmark:
              $ref: '#/components/schemas/shared-node-fwmark'
            list:
              description: |
                Names of the monitors to be read.
              type: array
              items:
                type: string
          additionalProperties: false
      additionalProperties: false
    node-redis:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: redis
        format:
          default: json
          $ref: '#/components/schemas/format'
        mode:
          type: string
          enum:
            - key
            - set-get
            - hash
            - hset-hget
            - channel
            - pub-sub
          default: key
          description: |
            - `key`: [Get](https://redis.io/commands/get)/[Set](https://redis.io/commands/set) of [Redis strings](https://redis.io/topics/data-types#strings)
              - The implementation uses the Redis `MSET` and `MGET` commands.
            - `hash`: Hashtables using [hash data-type](https://redis.io/topics/data-types#hashes)
              - The implementation uses the Redis `HMSET` and `HGETALL` commands.
            - `channel`: [Publish/subscribe](https://redis.io/topics/pubsub)
              - The implementation uses the Redis `PUBLISH` and `SUBSCRIBE` commands.
        uri:
          type: string
          format: uri
          description: |
            A Redis connection URI in the form of: `redis://<user>:<password>@<host>:<post>/<db>`.
        host:
          type: string
          default: localhost
          description: |
            The hostname or IP address of the Redis server.

            You can also connect to Redis server with a URI:

            - `tcp://[[username:]password@]host[:port][/db]`
            - `unix://[[username:]password@]path-to-unix-domain-socket[/db]`
        port:
          type: integer
          description: The port number of the Redis server to connect to.
          default: 6379
        path:
          type: string
          description: A path of a Unix socket which should be used for the connection.
        user:
          type: string
          default: default
          description: |
            The username which should be used for authentication.

            See: https://redis.io/commands/auth
        password:
          type: string
          description: |
            The password which should be used for authentication.

            See: https://redis.io/commands/auth
        db:
          type: integer
          default: 0
          description: |
            The logical database which should be used by the Redis client.

            See: https://redis.io/commands/select
        timeout:
          type: object
          properties:
            connect:
              type: number
              description: The timeout in seconds for the initial connection establishment.
            socket:
              type: number
              description: The timeout in seconds for executing commands against the Redis server.
          additionalProperties: false
        keepalive:
          type: boolean
          default: false
          description: Enable periodic keepalive packets.
        rate:
          type: number
          description: The rate in Hertz at which this node polls the Redis server for new values.
        key:
          type: string
          default: <node-name>
          description: The key which this node will use in the Redis keyspace.
        channel:
          type: string
          default: <node-name>
          description: The channel which this node will use when `mode` setting is `channel`.
        notify:
          type: boolean
          default: true
          description: |
            Use [Redis keyspace notifications](https://redis.io/topics/notifications) to listen for new updates.
            This setting is only used if setting `mode` is set to `key` or `hash`.
        ssl:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
              description: If enabled the connection to the Redis server will be encrypted via SSL/TLS.
            cacert:
              type: string
              description: A path to a CA certificate file.
            cacertdir:
              type: string
              description: A path to a directory containing CA certificates.
            cert:
              type: string
              description: A path to a client certificate file.
            key:
              type: string
              description: A path to the private key file.
          additionalProperties: false
        in:
          $ref: '#/components/schemas/shared-node-in'
        out:
          $ref: '#/components/schemas/shared-node-out'
      additionalProperties: false
    node-rtp:
      type: object
      required:
        - type
        - in
        - out
      properties:
        type:
          type: string
          const: rtp
        format:
          default: villas.binary
          $ref: '#/components/schemas/format'
        rtcp:
          type: boolean
          description: Enable Real-time Control Protocol (RTCP)
        aimd:
          type: object
          properties:
            a:
              type: number
              default: 10
            b:
              type: number
              default: 0.5
            Kp:
              type: number
              default: 1
            Ki:
              type: number
              default: 0
            Kd:
              type: number
              default: 0
            rate_min:
              type: number
              default: 1
            rate_source:
              type: number
              default: 2000
            rate_init:
              type: number
            log:
              type: string
            hook_type:
              type: string
              default: disabled
              enum:
                - decimate
                - limit_rate
                - disabled
          additionalProperties: false
        in:
          type: object
          required:
            - address
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            address:
              type: string
              description: |
                The local address and port number this node should listen for incoming packets.
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
          additionalProperties: false
        out:
          type: object
          required:
            - address
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            address:
              type: string
              description: |
                The remote address and port number to which this node will send data.
            netem:
              $ref: '#/components/schemas/shared-node-netem'
            fwmark:
              $ref: '#/components/schemas/shared-node-fwmark'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
          additionalProperties: false
      additionalProperties: false
    node-shmem:
      title: Shared Memory
      type: object
      required:
        - type
        - in
        - out
      properties:
        type:
          type: string
          const: shmem
        queuelen:
          type: integer
          description: Length of the input and output queues in elements.
        mode:
          type: string
          default: pthread
          enum:
            - pthread
            - polling
          description: |
            If set to `pthread`, POSIX condition variables (CV) are used to signal writes between processes.
            If set to `polling`, no CV's are used, meaning that blocking writes have to be implemented using polling, leading to performance improvements at a cost of unnecessary CPU usage.
        exec:
          description: |
            Optional name and command-line arguments (as passed to `execve`) of a command to be executed during node startup.
            This can be used to start the external program directly from VILLASNode. If unset, no command is executed.
          type: array
          items:
            type: string
        in:
          type: object
          required:
            - name
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
            name:
              type: string
              description: |
                Name of the POSIX shared memory object.
                Must start with a forward slash (/).
                The same name should be passed to the external program somehow in its configuration or command-line arguments.
          additionalProperties: false
        out:
          type: object
          required:
            - name
          properties:
            enabled:
              default: true
              $ref: '#/components/schemas/shared-node-enabled'
            netem:
              $ref: '#/components/schemas/shared-node-netem'
            fwmark:
              $ref: '#/components/schemas/shared-node-fwmark'
            builtin:
              default: true
              $ref: '#/components/schemas/shared-node-builtin'
            vectorize:
              default: 1
              $ref: '#/components/schemas/shared-node-vectorize'
            hooks:
              default: []
              $ref: '#/components/schemas/shared-hook-list'
            signals:
              $ref: '#/components/schemas/shared-signal-list'
            name:
              type: string
              description: |
                Name of the POSIX shared memory object.
                Must start with a forward slash (/).
                The same name should be passed to the external program somehow in its configuration or command-line arguments.
          additionalProperties: false
      additionalProperties: false
    node-signal-type:
      type: string
      enum:
        - random
        - sine
        - square
        - triangle
        - ramp
        - counter
        - constant
        - mixed
        - pulse
    node-signal-value:
      description: |
        A single value which is applied to all generated signals, or an array
        with one value per signal (its length must then match `values`).
      oneOf:
        - type: number
        - type: array
          items:
            type: number
    node-signal:
      title: Signal Generator
      type: object
      required:
        - type
        - signal
      properties:
        type:
          type: string
          const: signal
        signal:
          description: |
            The type of signal which should be generated.

            A single value is applied to all generated signals, or an array with one
            entry per signal may be given (its length must then match `values`).

            - `random`: a random walk with normal distributed step sizes will be generated.
            - `sine`: a sine signal will be generated.
            - `square`: a square / rectangle wave will be generated.
            - `triangle`: a triangle wave will be generated.
            - `ramp`: the generator will produce a ramp signal in the interval `[ 0, 1 / f ]`.
            - `counter`: increasing integer counter is generated.
            - `constant`: a constant value generated.
            - `mixed`: the signals of of each sample are generated by cycling over all remaining signal types.
            - `pulse`: generates pulses with a set frequency, phase and width
          oneOf:
            - $ref: '#/components/schemas/node-signal-type'
            - type: array
              items:
                $ref: '#/components/schemas/node-signal-type'
        values:
          type: integer
          default: 1
          description: The number of signals which each of the generated samples should contain.
        rate:
          type: number
          description: The rate at which sample should be generated by the node.
          default: 10
        amplitude:
          default: 1
          description: The amplitude of the signal when the `signal` setting is one of `sine`, `square` or `triangle`.
          allOf:
            - $ref: '#/components/schemas/node-signal-value'
        frequency:
          default: 1
          description: The frequency of the signal when the `signal` setting is one of `sine`, `square`, `triangle`,`pulse` or `ramp`.
          allOf:
            - $ref: '#/components/schemas/node-signal-value'
        phase:
          default: 0
          description: Tha pase of the signal when the `signal` setting is one of `sine` or `pulse`.
          allOf:
            - $ref: '#/components/schemas/node-signal-value'
        pulse_width:
          default: 1
          description: The width of the pulse, with respect to the rate
          allOf:
            - $ref: '#/components/schemas/node-signal-value'
        pulse_low:
          default: 0
          description: The low value of the pulse signal.
          allOf:
            - $ref: '#/components/schemas/node-signal-value'
        pulse_high:
          default: 1
          description: The high value of the pulse signal.
          allOf:
            - $ref: '#/components/schemas/node-signal-value'
        stddev:
          default: 0.2
          description: The standard deviation of the normal distributed steps if the `signal` setting is set to `random`.
          allOf:
            - $ref: '#/components/schemas/node-signal-value'
        offset:
          default: 0
          description: Adds a constant offset to each of the generated signals.
          allOf:
            - $ref: '#/components/schemas/node-signal-value'
        limit:
          type: integer
          default: -1
          description: |
            Limit the number of generated output samples by this node-type.
            A negative number disables the limitation.
        realtime:
          type: boolean
          default: true
          description: Wait `1 / rate` seconds between emitting each sample.
        monitor_missed:
          type: boolean
          default: true
          description: |
            If `true`, the `signal` node-type will count missed steps and warn the user during every iteration about missed steps.
            Especially at high rates, it can be beneficial for performance to set this flag to `false`.
            Warnings would namely cause system calls which will slow the node down even more, and thus cause even more missed steps.
        in:
          $ref: '#/components/schemas/shared-node-in'
        out:
          $ref: '#/components/schemas/shared-node-out'
      additionalProperties: false
      definitions:
        node-signal-type:
          type: string
          enum:
            - random
            - sine
            - square
            - triangle
            - ramp
            - counter
            - constant
            - mixed
            - pulse
        node-signal-value:
          description: |
            A single value which is applied to all generated signals, or an array
            with one value per signal (its length must then match `values`).
          oneOf:
            - type: number
            - type: array
              items:
                type: number
    node-signal_v2-signal:
